# Default Oracle retriever SQL templates.
# See postgres_queries.yaml for placeholder documentation.
# Oracle templates use FETCH FIRST … ROWS ONLY and VECTOR_DISTANCE.

entity_list: |
  SELECT {item_select}
  FROM {item_from} e

entity_filter: |
  SELECT {item_select}
  FROM {item_from} e
  WHERE ({where})
  FETCH FIRST $limit ROWS ONLY

entity_column_order: |
  SELECT {item_select}
  FROM {item_from} e
  WHERE ({where})
  ORDER BY {order_by}
  FETCH FIRST $limit ROWS ONLY

entity_column_order_open: |
  SELECT {item_select}
  FROM {item_from} e
  ORDER BY {order_by}
  FETCH FIRST $limit ROWS ONLY

entity_by_ids: |
  SELECT {item_select}
  FROM {item_from} e
  WHERE e.{id_column} IN ({id_in_list})
  ORDER BY CASE e.{id_column} {id_order_case} END

embedding_vector_search: |
  SELECT emb.{entity_id_column} AS entity_id, i.attrs,
         (1 - VECTOR_DISTANCE(emb.{vector_column}, $query_vector, {vector_distance_metric})) AS score
  FROM {emb_from} emb
  JOIN {item_from} i ON i.{id_column} = emb.{entity_id_column}
  WHERE {emb_filter}
  ORDER BY score DESC
  FETCH FIRST $limit ROWS ONLY

embedding_lookup: |
  SELECT emb.{vector_column} AS embedding
  FROM {emb_from} emb
  WHERE {emb_filter}
    AND emb.{entity_id_column} = $entity_id

embedding_similarity_search: |
  SELECT emb.{entity_id_column} AS entity_id, i.attrs,
         (1 - VECTOR_DISTANCE(emb.{vector_column}, $query_vector, {vector_distance_metric})) AS score
  FROM {emb_from} emb
  JOIN {item_from} i ON i.{id_column} = emb.{entity_id_column}
  WHERE {emb_filter}
  ORDER BY score DESC
  FETCH FIRST $limit ROWS ONLY

lexical_oracle_text: |
  SELECT {id_column} AS entity_id, attrs, SCORE({text_score_label}) AS score
  FROM {item_from}
  WHERE CONTAINS({search_text_column}, $query_text, {text_score_label}) > 0
  ORDER BY score DESC
  FETCH FIRST $limit ROWS ONLY

lexical_like_fallback: |
  SELECT {id_column} AS entity_id, attrs, 0.1 AS score
  FROM {item_from}
  WHERE UPPER(DBMS_LOB.SUBSTR({search_text_column}, 4000, 1)) LIKE UPPER($query_text)
  ORDER BY score DESC
  FETCH FIRST $limit ROWS ONLY

interaction_items_for_user: |
  SELECT {item_id_column} AS item_id
  FROM {interaction_from}
  WHERE {user_id_column} = $entity_id

personal_filter_ids: |
  SELECT {select_column} AS ban_id
  FROM {filter_from}
  WHERE {where_column} = $entity_id
